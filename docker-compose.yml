services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: parent_tutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
  createbucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p local/parent-tutor || true; exit 0"
  api:
    build: ./backend
    env_file: .env
    depends_on: [db, redis, minio, createbucket]
    ports: ["8000:8000"]
    volumes:
    - ./backend:/app
  worker:
    build: ./backend
    env_file: .env
    depends_on: [db, redis, minio, createbucket]
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --concurrency=2
    volumes:
    - ./backend:/app
volumes:
  pgdata:
  miniodata:


